name: night_safety_app
description: Silent distress detection prototype using phone motion sensors.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^7.1.0
  geolocator: ^11.0.0
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  flutter_send_sms:
    path: ./packages/flutter_send_sms
  permission_handler: ^11.3.1
  flutter_phone_direct_caller: ^2.1.1
  flutter_background_service: ^5.0.5
  flutter_local_notifications: ^18.0.1
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/siren.mp3
